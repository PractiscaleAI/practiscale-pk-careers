<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practiscale Logo Zoom Preloader</title>
<style>
:root{--mint:#2dca9f;--blue:#0d77a9;--deep:#082d31;--panel:#fff;--line:#d3dede;--fg:#0b1f22;--bg:#f6fafa;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1d2a2c;--line:#34494b;--fg:#e8f3f2;--bg:#142022;color-scheme:dark}}
:root[data-theme="dark"]{--panel:#1d2a2c;--line:#34494b;--fg:#e8f3f2;--bg:#142022;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#f6fafa;font-family:"Space Grotesk",system-ui,sans-serif}
.site{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(20px,8vw,120px);color:#0b1f22;
  background:radial-gradient(70% 60% at 90% 10%,rgba(45,202,159,.25),transparent 60%),radial-gradient(60% 60% at 0% 100%,rgba(13,119,169,.18),transparent 65%),#f6fafa;
  transform:scale(1.08);opacity:.55;transition:transform 1.4s cubic-bezier(.22,1,.36,1),opacity 1.2s ease}
body.landed .site{transform:none;opacity:1}
.site img{width:min(220px,50vw);height:auto;margin-bottom:auto;margin-top:clamp(20px,6vh,56px)}
.site h1{font-size:clamp(2.4rem,8vw,6rem);margin:0;font-weight:600;letter-spacing:-.035em;line-height:1}
.site p{max-width:44ch;margin:1rem 0 auto;color:#4a6366;line-height:1.5}
/* preloader */
#pre{--w:min(400px,66vmin);position:fixed;inset:0;z-index:10;pointer-events:auto}
#pre.gone{display:none}
#pre.exit{pointer-events:none}
.stage{position:absolute;inset:0}
.ring{position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);transform:translate(-50%,-50%);overflow:visible}
.fade{transition:opacity .35s ease}
.exit .fade{opacity:0}
.vig{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.04),transparent 60%,rgba(0,0,0,.18) 100%);pointer-events:none}
.grain{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.exit .grain{opacity:0}
.arc{transition:opacity .35s ease}
.exit .arc{opacity:0}
.icn{transition:opacity .25s ease}
.exit .icn{opacity:0}
.pct{font:600 34px "Space Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums;fill:#eafaf6}
.lbl{font:600 10px "Space Grotesk",system-ui,sans-serif;letter-spacing:.22em;fill:#8fe0cf}
.logo{position:absolute;left:50%;transform:translateX(-50%);top:calc(50% + var(--w)*.4);width:clamp(170px,26vw,250px);height:auto;filter:brightness(0) invert(1)}
@media (prefers-reduced-motion:reduce){.site,.fade{transition-duration:.01s!important}}
/* controls */
#ctl{position:fixed;z-index:20;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(250px,calc(100% - 24px));max-height:60%;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#ctl summary{cursor:pointer;font-weight:600;list-style:none}
#ctl summary::-webkit-details-marker{display:none}
#ctl label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
#ctl input[type=range]{width:110px}
#ctl select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
#ctl button{width:100%;margin-top:6px;padding:9px;border:0;border-radius:8px;background:linear-gradient(90deg,#0f8272,#0b6a9a);color:#fff;font:inherit;font-weight:600;cursor:pointer}
#ctl button:focus-visible,#ctl input:focus-visible,#ctl select:focus-visible,#ctl summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
<style id="website-host-only">
html,body{background:transparent!important}
.site,#ctl{display:none!important}
</style></head>

      'L'+f(C+RI*s)+' '+f(C-RI*c)+'A'+RI+' '+RI+' 0 '+L+' 0 '+C+' '+(C-RI)+'Z';
  }
  function build(){
    pre.innerHTML='';
    pre.appendChild(tpl.content.firstElementChild.cloneNode(true));
  }
  function applyStyle(){
    each('.grain',function(e){e.style.display=$('showNoise').checked?'':'none'});
  }
  function paint(p,done){
    each('.arc',function(e){e.setAttribute('d',sector(p))});
    each('.clip',function(e){e.setAttribute('y',f(67*(1-p)));e.setAttribute('height',f(67*p+1))});
    pre.setAttribute('aria-valuenow',Math.floor(p*100));
  }
  /* Exit: the logo icon becomes a window, then the screen zooms through it (into its upper wing) until the page fills the view. */
  function exit(){
    pre.classList.add('exit');
    var hole=pre.querySelector('.hole'),edge=pre.querySelector('.edge');
    var svg=pre.querySelector('.ring'),sc=svg.getBoundingClientRect().width/560,veil=pre.querySelector('.veil');
    var FX=45.6,FY=21.3,R=7.3,IX=38.5,IY=33.5,K0=1.3,T1=260,T2=1600,t0=performance.now(),landed=false;
    var K1=Math.max(60,Math.hypot(innerWidth,innerHeight)/2/sc/R*1.6);
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){T1=60;T2=240}
    var P0x=C+K0*(FX-IX),P0y=C+K0*(FY-IY);
    (function tick(now){
      var t=now-t0,a=Math.min(t/T1,1),z=0,uu=0;
      if(t>T1){
        if(!landed){landed=true;document.body.classList.add('landed')}
        uu=Math.min((t-T1)/T2,1);z=uu*uu*(3-2*uu);
      }
      var k=K0+(K1-K0)*Math.pow(uu,2.2),px=P0x+(C-P0x)*z,py=P0y+(C-P0y)*z;
      var tr='translate('+f(px)+' '+f(py)+') scale('+k.toFixed(4)+') translate(-'+FX+' -'+FY+')';
      hole.setAttribute('transform',tr);edge.setAttribute('transform',tr);
      hole.setAttribute('opacity',String(a));
      veil.style.opacity=uu>.985?String(Math.max(0,1-(uu-.985)/.015)):'1';
      edge.setAttribute('opacity',String(.9*a*(1-z)));
      if(t<T1+T2){raf=requestAnimationFrame(tick);return}
      pre.classList.add('gone');
    })(t0);
  }
  function run(){
    cancelAnimationFrame(raf);clearTimeout(hold);clearTimeout(exitT);
    document.body.classList.remove('landed');
    pre.className='';
    build();applyStyle();paint(0,false);
    var total=parseFloat($('duration').value)*1000,fn=ease[$('easing').value],start=performance.now();
    (function tick(){
      var raw=Math.min((performance.now()-start)/total,1);
      if(raw<1){paint(fn(raw),false);raf=requestAnimationFrame(tick);return}
      paint(1,true);
      hold=setTimeout(exit,HOLD);
    })();
  }
  ['showNoise'].forEach(function(id){$(id).addEventListener('input',applyStyle)});
  $('replay').addEventListener('click',run);
  $('ctl').open=innerWidth>=1100&&innerHeight>=720;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){$('duration').value=1}
  run();
})();
</script>
<script id="website-host-bridge">
(function(){
  var send=function(type,extra){parent.postMessage(Object.assign({source:'practiscale-original-preloader',type:type},extra||{}),location.origin)};
  var pre=document.getElementById('pre'),landed=false,complete=false;

  // replays its current state without restarting or altering the original art.
  window.addEventListener('message',function(event){
    if(event.source!==parent||event.origin!==location.origin||event.data?.source!=='practiscale-host-preloader'||event.data?.type!=='sync')return;
    send('progress',{value:Number(pre.getAttribute('aria-valuenow')||0)});
    if(document.body.classList.contains('landed'))send('landed');
    if(pre.classList.contains('gone'))send('complete');
    else send('ready');
  });
  var observer=new MutationObserver(function(){
    send('progress',{value:Number(pre.getAttribute('aria-valuenow')||0)});
    if(!landed&&document.body.classList.contains('landed')){landed=true;send('landed')}
    if(!complete&&pre.classList.contains('gone')){complete=true;send('complete');observer.disconnect()}
  });
  observer.observe(pre,{attributes:true,attributeFilter:['class','aria-valuenow']});
  observer.observe(document.body,{attributes:true,attributeFilter:['class']});
  requestAnimationFrame(function(){requestAnimationFrame(function(){send('ready')})});
